[project]
name = "hermes-claude-cli-bridge"
version = "0.1.0"
description = "Use the Claude Code CLI as a Hermes Agent model provider, with one resumable Claude Code session per Hermes thread."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar AL Zabir" }]
dependencies = []          # standard library only
keywords = ["hermes", "hermes-agent", "claude", "claude-code", "llm", "bridge", "openai-compatible"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/oazabir/hermes-claude-cli-bridge"
Repository = "https://github.com/oazabir/hermes-claude-cli-bridge"
Issues = "https://github.com/oazabir/hermes-claude-cli-bridge/issues"

[project.scripts]
hermes-claude-cli-bridge = "hermes_claude_cli_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_claude_cli_bridge"]   # includes plugin/claude-code-bridge/ as package data

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = []                   # tests use only the standard library: uv run python -m unittest discover -s tests -v
